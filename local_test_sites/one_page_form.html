<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply — Backend Engineer</title></head>
<body>
<h1>Application: Backend Engineer</h1>
<form id="application-form">
  <section>
    <h2>Personal Information</h2>
    <label for="first_name">First Name</label>
    <input type="text" id="first_name" name="first_name" required>

    <label for="last_name">Last Name</label>
    <input type="text" id="last_name" name="last_name" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone">

    <label for="country">Country</label>
    <select id="country" name="country" required>
      <option value="">Select...</option>
      <option value="us">United States</option>
      <option value="ca">Canada</option>
      <option value="de">Germany</option>
    </select>
  </section>

  <section>
    <h2>Work Authorization</h2>
    <fieldset>
      <legend>Are you legally authorized to work in the United States?</legend>
      <label><input type="radio" name="authorized" value="Yes"> Yes</label>
      <label><input type="radio" name="authorized" value="No"> No</label>
    </fieldset>

    <label>
      <input type="checkbox" id="relocate" name="relocate" value="yes">
      I am willing to relocate
    </label>
  </section>

  <section>
    <h2>About You</h2>
    <label for="why_company">Why do you want to work here?</label>
    <textarea id="why_company" name="why_company" rows="4"></textarea>
  </section>

  <button type="button" id="next-button">Save and Continue</button>
</form>
<script>
  document.getElementById('next-button').addEventListener('click', function () {
    document.querySelector('h1').textContent = 'Application Saved';
  });
</script>
</body>
</html>
