<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Two-Factor Authentication</title></head>
<body>
<h1>Two-factor authentication required</h1>
<p>Enter the verification code we sent to your device.</p>
<form>
  <label for="otp">Verification code</label>
  <input type="text" id="otp" name="otp" autocomplete="one-time-code" inputmode="numeric">
  <button type="submit">Verify</button>
</form>
</body>
</html>
