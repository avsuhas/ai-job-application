<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8">
<title>OtherCorp - Backend Engineer</title>
</head>
<body>
<h1>Backend Engineer</h1>
<form id="application-form" action="lever_confirmation.html" method="get">
  <section>
    <label for="name">Full name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone">

    <label for="org">Current company</label>
    <input type="text" id="org" name="org">
  </section>

  <section>
    <label for="resume">Resume/CV</label>
    <input type="file" id="resume" name="resume" required>
  </section>

  <section>
    <h3>Links</h3>
    <label for="urls[LinkedIn]">LinkedIn URL</label>
    <input type="url" id="urls[LinkedIn]" name="urls[LinkedIn]">

    <label for="urls[GitHub]">GitHub URL</label>
    <input type="url" id="urls[GitHub]" name="urls[GitHub]">
  </section>

  <section>
    <h3>Additional Information</h3>
    <label for="card-0">What interests you about this role?</label>
    <textarea id="cards[abc][0]" name="cards[abc][0]" rows="3"></textarea>
  </section>

  <button type="submit" id="btn-submit" class="template-btn-submit">Submit application</button>
</form>
</body>
</html>
