<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply — Required Fields</title></head>
<body>
<h1>Required Information</h1>
<form id="form">
  <label for="email">Email Address</label>
  <input type="email" id="email" name="email" required aria-describedby="email-error">
  <span id="email-error" class="field-error" role="alert" style="display:none;color:red">
    Email address is required.
  </span>

  <button type="button" id="next-button">Continue</button>
</form>
<script>
  document.getElementById('next-button').addEventListener('click', function () {
    var email = document.getElementById('email');
    var error = document.getElementById('email-error');
    if (!email.value) {
      error.style.display = 'inline';
    } else {
      error.style.display = 'none';
      document.querySelector('h1').textContent = 'Saved';
    }
  });
</script>
</body>
</html>
