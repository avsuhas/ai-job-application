<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply — Documents</title></head>
<body>
<h1>Upload Your Documents</h1>
<form>
  <label for="resume">Resume/CV</label>
  <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx,.txt,.md" required>

  <label for="cover_letter">Cover Letter (optional)</label>
  <input type="file" id="cover_letter" name="cover_letter" accept=".pdf,.txt,.md">

  <button type="button" id="next-button">Continue</button>
</form>
</body>
</html>
