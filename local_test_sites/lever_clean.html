<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8">
<title>OtherCorp - Backend Engineer</title>
</head>
<body>
<h1>Backend Engineer</h1>
<form id="application-form" action="lever_confirmation.html" method="get">
  <label for="name">Full name</label>
  <input type="text" id="name" name="name" required>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" required>

  <label for="phone">Phone</label>
  <input type="tel" id="phone" name="phone">

  <label for="org">Current company</label>
  <input type="text" id="org" name="org">

  <label for="resume">Resume/CV</label>
  <input type="file" id="resume" name="resume" required>

  <label for="urls[LinkedIn]">LinkedIn URL</label>
  <input type="url" id="urls[LinkedIn]" name="urls[LinkedIn]">

  <button type="submit" id="btn-submit" class="template-btn-submit">Submit application</button>
</form>
</body>
</html>
